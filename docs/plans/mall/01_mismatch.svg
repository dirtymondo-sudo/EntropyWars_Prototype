="447.0" x2="628.0" y2="447.0" stroke="#e4e0d6" stroke-width="1"/><line x1="40.0" y1="468.0" x2="628.0" y2="468.0" stroke="#e4e0d6" stroke-width="1"/><rect x="40.0" y="90.0" width="576.0" height="384.0" fill="#ecebe6" stroke="#1c2330" stroke-width="2"/><text x="328.0" y="110.0" font-size="15" fill="#1c2330" text-anchor="middle" font-weight="bold">THE INSIDE TODAY: room site_prebuilt_downtown_mall · 96 x 64 m · 12 m high</text><text x="328.0" y="130.0" font-size="12" fill="#1c2330" text-anchor="middle">one grey hall: atrium + fountain, upper galleries at 4.6 m, a catwalk at 8.4 m, food court, arcade, clock tower</text><text x="328.0" y="462.0" font-size="12" fill="#1c2330" text-anchor="middle">floor 6,144 m² · one door to the city (south wall) · one door to the supply closet (north wall)</text><rect x="76.0" y="186.0" width="168.0" height="168.0" fill="#f3dca8" stroke="#e5484d" stroke-width="3"/><rect x="134.8" y="186.0" width="50.4" height="168.0" fill="#8fdcec" stroke="#1c2330" stroke-width="1"/><rect x="76.0" y="244.8" width="168.0" height="50.4" fill="#8fdcec" stroke="#1c2330" stroke-width="1"/><circle cx="160.0" cy="270.0" r="31.2" fill="#8fdcec" stroke="#1c2330" stroke-width="1"/><text x="160.0" y="216.0" font-size="14" fill="#e5484d" text-anchor="middle" font-weight="bold">THE OUTSIDE TODAY</text><text x="160.0" y="232.0" font-size="12" fill="#1c2330" text-anchor="middle">building P10-10-B1</text><text x="160.0" y="324.0" font-size="12" fill="#1c2330" text-anchor="middle">28 x 28 m · 10.5 m eaves</text><text x="160.0" y="340.0" font-size="12" fill="#1c2330" text-anchor="middle">784 m² · one door (west)</text><rect x="340.0" y="162.0" width="210.0" height="231.0" fill="#fff3da" stroke="#1f8a4c" stroke-width="3"/><rect x="550.0" y="288.0" width="42.0" height="105.0" fill="#ff9d86" stroke="#1f8a4c" stroke-width="2"/><rect x="424.0" y="162.0" width="42.0" height="231.0" fill="#8fdcec" stroke="#1c2330" stroke-width="1"/><rect x="340.0" y="246.0" width="210.0" height="42.0" fill="#8fdcec" stroke="#1c2330" stroke-width="1"/><circle cx="445.0" cy="267.0" r="42.0" fill="#8fdcec" stroke="#1c2330" stroke-width="1"/><text x="445.0" y="192.0" font-size="14" fill="#1f8a4c" text-anchor="middle" font-weight="bold">THE ONE BUILDING</text><text x="445.0" y="208.0" font-size="12" fill="#1c2330" text-anchor="middle">outside = inside</text><text x="445.0" y="348.0" font-size="12" fill="#1c2330" text-anchor="middle">35 x 38.5 m · two floors</text><text x="445.0" y="364.0" font-size="12" fill="#1c2330" text-anchor="middle">1,348 m² a floor · five doors</text><text x="40.0" y="504.0" font-size="15" fill="#1c2330" text-anchor="start" font-weight="bold">Today the inside is 3.4 times as long and 2.3 times as wide as the building it is said to be in: 7.8 times the floor.</text><text x="40.0" y="526.0" font-size="13" fill="#1c2330" text-anchor="start">Outside: pastel stucco, terracotta roofs, a glass cross vault and a dome, windows on four sides. Inside: a flat grey ceiling, no vault, no dome, eight portholes.</text><text x="40.0" y="546.0" font-size="13" fill="#1c2330" text-anchor="start">Outside the door is on the west face. Inside the same door is in the south wall. The green box is the plan: one size for both.</text></svg>