stroke-width="6"/><polygon points="584,334 575,318 593,318" fill="#fff"/><line x1="646" y1="348" x2="646" y2="400" stroke="#fff" stroke-width="6"/><polygon points="624,374 640,365 640,383" fill="#fff"/><circle cx="384" cy="202" r="6" fill="#ff3b3b" stroke="#fff" stroke-width="1.5"/><text x="374" y="206" font-size="10.5" font-weight="700" text-anchor="end" fill="#fff" stroke="#000" stroke-width="2.6" paint-order="stroke">THE OLD TREE</text><circle cx="756" cy="78" r="6" fill="#ff3b3b" stroke="#fff" stroke-width="1.5"/><text x="746" y="82" font-size="10.5" font-weight="700" text-anchor="end" fill="#fff" stroke="#000" stroke-width="2.6" paint-order="stroke">the lookout</text><circle cx="260" cy="326" r="6" fill="#ff3b3b" stroke="#fff" stroke-width="1.5"/><text x="250" y="330" font-size="10.5" font-weight="700" text-anchor="end" fill="#fff" stroke="#000" stroke-width="2.6" paint-order="stroke">the ruin</text><circle cx="1128" cy="326" r="6" fill="#ff3b3b" stroke="#fff" stroke-width="1.5"/><text x="1118" y="330" font-size="10.5" font-weight="700" text-anchor="end" fill="#fff" stroke="#000" stroke-width="2.6" paint-order="stroke">lowest, wettest</text><circle cx="1252" cy="202" r="6" fill="#ff3b3b" stroke="#fff" stroke-width="1.5"/><text x="1242" y="206" font-size="10.5" font-weight="700" text-anchor="end" fill="#fff" stroke="#000" stroke-width="2.6" paint-order="stroke">the cabin</text><circle cx="1500" cy="202" r="6" fill="#ff3b3b" stroke="#fff" stroke-width="1.5"/><text x="1490" y="206" font-size="10.5" font-weight="700" text-anchor="end" fill="#fff" stroke="#000" stroke-width="2.6" paint-order="stroke">the drain</text><circle cx="508" cy="78" r="6" fill="#ff3b3b" stroke="#fff" stroke-width="1.5"/><text x="498" y="82" font-size="10.5" font-weight="700" text-anchor="end" fill="#fff" stroke="#000" stroke-width="2.6" paint-order="stroke">THE STAIR</text><text x="26" y="714" font-size="14" fill="#ddd">The big number = the plot's level (1 level = 1.75 m; light = high, dark = low). Yellow border = The Clearing, blue = Dead Man's Cave, red dashes = a new plot (10; names are plain ideas).</text><text x="26" y="737" font-size="14" fill="#ddd">BROWN = the main trail, 3 squares wide. It never crosses a plot in a straight line: it switchbacks up and down through all three rows, and crosses the dry creek four times.</text><text x="26" y="760" font-size="14" fill="#ddd">WHITE BAR + ARROW = a LEDGE: a drop you jump DOWN and cannot climb. Going east (downhill) you hop ledge to ledge along the creek; going back up you take the trail.</text><text x="26" y="783" font-size="14" fill="#ddd">YELLOW DOTS = thin trails, 1 square: the Loop past the stick men and the ruin, the way under the ridge, the wet way out of the Sump. The ways out of the room keep their level and door.</text><text x="26" y="806" font-size="14" fill="#ddd">Climb from the Stair (2) to the Top (6), then it is down all the way to the Storm Drain (0). West: over the Old Tree's rise (5) and jump back down to the Crossroads. Nothing is built yet.</text></svg>