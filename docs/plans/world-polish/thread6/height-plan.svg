 y="214" font-size="24" font-weight="700" fill="#fff">2</text><text x="956" y="304" font-size="10.5" text-anchor="middle" fill="#fff">The Dry Creek, lower</text><rect x="1019" y="189" width="122" height="122" fill="rgb(86,92,72)" stroke="#6fb7ff" stroke-width="2"/><text x="1026" y="214" font-size="24" font-weight="700" fill="#fff">1</text><text x="1080" y="304" font-size="10.5" text-anchor="middle" fill="#fff">The Hollow</text><rect x="1143" y="189" width="122" height="122" fill="rgb(60,69,56)" stroke="#6fb7ff" stroke-width="2"/><text x="1150" y="214" font-size="24" font-weight="700" fill="#fff">0</text><text x="1204" y="304" font-size="10.5" text-anchor="middle" fill="#fff">The Gully</text><rect x="1267" y="189" width="122" height="122" fill="rgb(60,69,56)" stroke="#6fb7ff" stroke-width="2"/><text x="1274" y="214" font-size="24" font-weight="700" fill="#fff">0</text><text x="1328" y="304" font-size="10.5" text-anchor="middle" fill="#fff">The Sewer Mouth</text><rect x="1267" y="313" width="122" height="122" fill="rgb(60,69,56)" stroke="#6fb7ff" stroke-width="2"/><text x="1274" y="338" font-size="24" font-weight="700" fill="#fff">0</text><text x="1328" y="428" font-size="10.5" text-anchor="middle" fill="#fff">The Tunnel Way</text><rect x="1391" y="189" width="122" height="122" fill="rgb(60,69,56)" stroke="#6fb7ff" stroke-width="2"/><text x="1398" y="214" font-size="24" font-weight="700" fill="#fff">0</text><text x="1452" y="304" font-size="10.5" text-anchor="middle" fill="#fff">The Storm Drain</text><rect x="523" y="65" width="122" height="122" fill="rgb(190,183,136)" stroke="#ff5a5a" stroke-width="3" stroke-dasharray="7 4"/><text x="530" y="90" font-size="24" font-weight="700" fill="#111">5</text><text x="584" y="180" font-size="10.5" text-anchor="middle" fill="#111">The Climb</text><rect x="647" y="65" width="122" height="122" fill="rgb(216,206,152)" stroke="#ff5a5a" stroke-width="3" stroke-dasharray="7 4"/><text x="654" y="90" font-size="24" font-weight="700" fill