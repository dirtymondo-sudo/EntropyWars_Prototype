<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="864" font-family="Helvetica,Arial,sans-serif"><rect width="100%" height="100%" fill="#16191a"/><text x="26" y="34" font-size="20" font-weight="700" fill="#eee">THE WOODS, the Clearing's room, PLAN 2: the main trail snakes, climbs by switchbacks, and you jump back down the ledges</text><rect x="27" y="189" width="122" height="122" fill="rgb(86,92,72)" stroke="#f2c14e" stroke-width="2"/><text x="34" y="214" font-size="24" font-weight="700" fill="#fff">1</text><text x="88" y="304" font-size="10.5" text-anchor="middle" fill="#fff">Deep woods, west</text><rect x="151" y="189" width="122" height="122" fill="rgb(138,137,104)" stroke="#f2c14e" stroke-width="2"/><text x="158" y="214" font-size="24" font-weight="700" fill="#111">3</text><text x="212" y="304" font-size="10.5" text-anchor="middle" fill="#111">The Trail West</text><rect x="275" y="189" width="122" height="122" fill="rgb(190,183,136)" stroke="#f2c14e" stroke-width="2"/><text x="282" y="214" font-size="24" font-weight="700" fill="#111">5</text><text x="336" y="304" font-size="10.5" text-anchor="middle" fill="#111">The Old Tree</text><rect x="399" y="189" width="122" height="122" fill="rgb(138,137,104)" stroke="#f2c14e" stroke-width="2"/><text x="406" y="214" font-size="24" font-weight="700" fill="#111">3</text><text x="460" y="304" font-size="10.5" text-anchor="middle" fill="#111">The Crossroads</text><rect x="523" y="189" width="122" height="122" fill="rgb(164,160,120)" stroke="#f2c14e" stroke-width="2"/><text x="530" y="214" font-size="24" font-weight="700" fill="#111">4</text><text x="584" y="304" font-size="10.5" text-anchor="middle" fill="#111">Deep woods, east</text><rect x="399" y="65" width="122" height="122" fill="rgb(112,115,88)" stroke="#f2c14e" stroke-width="2"/><text x="406" y="90" font-size="24" font-weight="700" fill="#fff">2</text><text x="460" y="180" font-size="10.5" text-anchor="middle" fill="#fff">The Stair</text><rect x="399" y="313"